<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mumbra Minutes - Print & Photo Order</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
        input[type="text"], input[type="tel"], select, input[type="number"], input[type="file"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }
        .summary { background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .summary p { margin: 5px 0; font-size: 16px; }
        .total-price { font-size: 20px; font-weight: bold; color: #28a745; }
        #qr-code { display: none; text-align: center; margin-top: 15px; }
        #qr-code img { max-width: 200px; border-radius: 8px; border: 1px solid #ddd; }
        button { width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:hover { background: #218838; }
        .location-btn { width: auto; margin-top: 0; padding: 10px 15px; font-size: 14px; background: #007bff; white-space: nowrap; }
        .location-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mumbra Minutes Order Form</h2>
    
    <form action="https://formspree.io/f/meajerbk" method="POST" enctype="multipart/form-data">
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter mobile number">

        <label for="address">Delivery Address:</label>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="address" name="address" required placeholder="Enter delivery address">
            <button type="button" class="location-btn" onclick="getLocation()">Use Current Location</button>
        </div>

        <label for="instructions">Delivery Instructions:</label>
        <input type="text" id="instructions" name="instructions" placeholder="Any special instructions (e.g. landmark or preferred time)">
        <label for="file-link">File / Image Link (Google Drive, Gallery Link, etc.):</label>
<input type="url" id="file-link" name="file_link" placeholder="Paste your Google Drive or Image link here" required>
        

        <label for="service">Select Service:</label>
        <select id="service" name="service" onchange="calculateTotal()">
            <option value="4">Black & White Print (₹4 / page)</option>
            <option value="10">Colour Print (₹10 / page)</option>
            <option value="40">Passport Size Photo (₹40 / 6 photos)</option>
            <option value="30">Lamination (₹30 / sheet)</option>
        </select>

        <label for="quantity">Quantity / Copies:</label>
        <input type="number" id="quantity" name="quantity" value="1" min="1" oninput="calculateTotal()" required>

        <label for="payment-method">Payment Mode:</label>
        <select id="payment-method" name="payment_method" onchange="togglePaymentUI()">
            <option value="COD">Cash on Delivery (COD)</option>
            
        </div>

        <div class="summary">
            <p>Total Amount: <span class="total-price">₹<span id="total">4</span></span></p>
        </div>

        <button type="submit">Confirm Order</button>
    </form>
</div>

<script>
    function calculateTotal() {
        const serviceRate = parseFloat(document.getElementById('service').value);
        const quantity = parseInt(document.getElementById('quantity').value) || 1;
        const total = serviceRate * quantity;
        document.getElementById('total').innerText = total;
    }

    function togglePaymentUI() {
        const paymentMethod = document.getElementById('payment-method').value;
        const qrDiv = document.getElementById('qr-code');
        if (paymentMethod === 'QR') {
            qrDiv.style.display = 'block';
        } else {
            qrDiv.style.display = 'none';
        }
    }

    function getLocation() { 
        if (navigator.geolocation) { 
            navigator.geolocation.getCurrentPosition(showPosition, showError); 
        } else { 
            alert("Geolocation is not supported by this browser."); 
        } 
    } 

    function showPosition(position) { 
        document.getElementById("address").value = "Lat: " + position.coords.latitude + ", Long: " + position.coords.longitude; 
    }

    function showError(error) {
        alert("Unable to retrieve location. Please type your address manually.");
    }
</script>

</body>
</html>
